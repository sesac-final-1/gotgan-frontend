# SonarQube Cloud CI 분석 설정 — frontend.yml 의 build job 이 sonarqube-scan-action 으로 읽는다 (컨벤션 1-3)
sonar.organization=sesac-gojigi
sonar.projectKey=sesac-final-1_gotgan-frontend
sonar.projectName=gotgan-frontend

sonar.sourceEncoding=UTF-8

# 소스 · 테스트 — 테스트는 src 안에 *.test.js(x) · *.spec.js(x) 로 둔다 (Vitest)
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# 커버리지 — Vitest coverage(lcov) 결과. 리포트가 없으면 경고만 남기고 커버리지 없이 분석
sonar.javascript.lcov.reportPaths=coverage/lcov.info
